<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emrul Zawad - Software Engineer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: none;
        }

        /* Paint canvas for brush effect */
        #paintCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Background animation */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 20%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 60%, rgba(120, 255, 198, 0.1) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(1deg); }
            66% { transform: translateY(10px) rotate(-1deg); }
        }

        .container {
            text-align: center;
            z-index: 1;
            animation: fadeInUp 1.5s ease-out;
            padding: clamp(1rem, 5vw, 2rem);
            max-width: 100vw;
            overflow-wrap: break-word;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .name {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 300;
            letter-spacing: clamp(1px, 0.5vw, 2px);
            margin-bottom: clamp(0.5rem, 3vw, 1rem);
            background: linear-gradient(45deg, #ffffff, #e0e0e0);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s ease-in-out infinite alternate;
            text-align: center;
            line-height: 1.1;
            word-break: break-word;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            }
            to {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            }
        }

        .title {
            font-size: clamp(0.9rem, 4vw, 1.5rem);
            font-weight: 300;
            letter-spacing: clamp(1px, 0.5vw, 3px);
            opacity: 0.8;
            margin-bottom: clamp(1.5rem, 5vw, 3rem);
            animation: fadeIn 2s ease-out 0.5s both;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.8; }
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: clamp(1rem, 4vw, 2rem);
            margin-top: clamp(2rem, 6vw, 3rem);
            animation: slideUp 1.5s ease-out 1s both;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-link {
            display: inline-flex;
            width: clamp(45px, 12vw, 60px);
            height: clamp(45px, 12vw, 60px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-width: 45px;
            min-height: 45px;
        }

        .social-link svg {
            width: clamp(16px, 4vw, 24px);
            height: clamp(16px, 4vw, 24px);
            transition: transform 0.3s ease;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .social-link:hover::before {
            left: 100%;
        }

        .social-link:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
        }

        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease, opacity 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            opacity: 1;
        }

        .cursor.hidden {
            opacity: 0;
        }

        /* Mobile devices (up to 480px) */
        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            
            .name {
                font-size: 2.5rem;
                letter-spacing: 1px;
                line-height: 1;
                margin-bottom: 0.8rem;
            }
            
            .title {
                font-size: 1rem;
                letter-spacing: 1.5px;
                margin-bottom: 2rem;
            }
            
            .social-links {
                gap: 1.5rem;
                margin-top: 2.5rem;
            }
            
            .social-link {
                width: 50px;
                height: 50px;
                min-width: 50px;
                min-height: 50px;
            }
            
            .social-link svg {
                width: 20px;
                height: 20px;
            }
        }

        /* Tablet devices (481px to 768px) */
        @media (min-width: 481px) and (max-width: 768px) {
            .name {
                font-size: 3.5rem;
                letter-spacing: 1.5px;
            }
            
            .title {
                font-size: 1.3rem;
                letter-spacing: 2px;
            }
            
            .social-links {
                gap: 2rem;
            }
            
            .social-link {
                width: 55px;
                height: 55px;
            }
            
            .social-link svg {
                width: 22px;
                height: 22px;
            }
        }

        /* Laptop/Desktop (769px to 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
            .name {
                font-size: 4rem;
                letter-spacing: 2px;
            }
            
            .title {
                font-size: 1.4rem;
                letter-spacing: 2.5px;
            }
            
            .social-link:hover svg {
                transform: scale(1.1);
            }
        }

        /* Large Desktop (1025px and up) */
        @media (min-width: 1025px) {
            .name {
                font-size: 5rem;
                letter-spacing: 2px;
            }
            
            .title {
                font-size: 1.5rem;
                letter-spacing: 3px;
            }
            
            .social-link:hover svg {
                transform: scale(1.2);
            }
        }

        /* Landscape orientation adjustments */
        @media (orientation: landscape) and (max-height: 600px) {
            .name {
                font-size: clamp(2rem, 6vh, 3.5rem);
                margin-bottom: 0.5rem;
            }
            
            .title {
                font-size: clamp(0.9rem, 3vh, 1.2rem);
                margin-bottom: 1.5rem;
            }
            
            .social-links {
                margin-top: 1.5rem;
            }
        }

        /* High DPI displays */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .social-link {
                border-width: 1px;
            }
        }

        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .social-link {
                transform: none;
                transition: background-color 0.3s ease, border-color 0.3s ease;
            }
            
            .social-link:active {
                background-color: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.6);
                transform: scale(0.95);
            }
        }
    </style>
</head>
<body>
    <canvas id="paintCanvas"></canvas>
    <div class="cursor"></div>
    
    <div class="container">
        <h1 class="name">Emrul Zawad</h1>
        <p class="title">Software Engineer</p>
        
        <div class="social-links">
            <a href="https://github.com/ehzawad" class="social-link" title="GitHub" target="_blank" rel="noopener noreferrer">

                </svg>
            </a>
            <a href="https://linkedin.com/in/ehzawad" class="social-link" title="LinkedIn" target="_blank" rel="noopener noreferrer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
            </a>
            <a href="https://x.com/ehzawad" class="social-link" title="X (Twitter)" target="_blank" rel="noopener noreferrer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>
                </svg>
            </a>
        </div>
    </div>

    <script>
        // Device detection
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isTablet = /(iPad|tablet|kindle|playbook|silk)|(android(?!.*mobile))/i.test(navigator.userAgent);
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        // Paint Canvas Setup
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.querySelector('.cursor');
        
        let mouseX = 0;
        let mouseY = 0;
        let cursorX = 0;
        let cursorY = 0;
        let lastX = 0;
        let lastY = 0;
        let cursorVisible = true;
        let hideTimeout;
        
        // Paint trails array
        let paintTrails = [];
        
        // Color palette for brush effect
        const colors = [
            'rgba(120, 119, 198, 0.3)',
            'rgba(255, 119, 198, 0.3)',
            'rgba(120, 255, 198, 0.3)',
            'rgba(255, 215, 119, 0.3)',
            'rgba(198, 120, 255, 0.3)',
            'rgba(119, 255, 215, 0.3)'
        ];
        
        let currentColorIndex = 0;

        // Initialize canvas
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        // Paint trail class
        class PaintTrail {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.alpha = 0.4;
                this.radius = Math.random() * 15 + 5;
                this.life = 1.0;
                this.decay = 0.02 + Math.random() * 0.02;
            }

            update() {
                this.life -= this.decay;
                this.alpha = this.life * 0.4;
                this.radius *= 0.98;
                return this.life > 0;
            }

            draw() {
                if (this.life <= 0) return;
                
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.globalCompositeOperation = 'overlay';
                
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius
                );
                
                gradient.addColorStop(0, this.color.replace('0.3', this.alpha.toString()));
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Show cursor
        function showCursor() {
            cursor.classList.remove('hidden');
            cursorVisible = true;
        }

        // Hide cursor after delay
        function hideCursorWithDelay() {
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                cursor.classList.add('hidden');
                cursorVisible = false;
            }, 2000);
        }

        // Create paint trail
        function createPaintTrail(x, y, velocityX, velocityY) {
            const speed = Math.sqrt(velocityX * velocityX + velocityY * velocityY);
            if (speed > 2) {
                // Change color based on speed and direction
                currentColorIndex = Math.floor((speed + Math.abs(velocityX) + Math.abs(velocityY)) / 10) % colors.length;
                
                for (let i = 0; i < Math.min(3, Math.floor(speed / 5)); i++) {
                    const offsetX = (Math.random() - 0.5) * 20;
                    const offsetY = (Math.random() - 0.5) * 20;
                    paintTrails.push(new PaintTrail(
                        x + offsetX, 
                        y + offsetY, 
                        colors[currentColorIndex]
                    ));
                }
            }
        }

        // Animation loop
        function animate() {
            // Clear canvas with slight fade effect
            ctx.fillStyle = 'rgba(26, 26, 26, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw paint trails
            paintTrails = paintTrails.filter(trail => {
                const alive = trail.update();
                if (alive) trail.draw();
                return alive;
            });

            requestAnimationFrame(animate);
        }

        // Mouse movement handling (desktop only)
        if (!isMobile && !isTouchDevice) {
            document.addEventListener('mousemove', (e) => {
                const prevX = mouseX;
                const prevY = mouseY;
                
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                // Calculate velocity
                const velocityX = mouseX - prevX;
                const velocityY = mouseY - prevY;
                
                // Show cursor and reset hide timer
                showCursor();
                hideCursorWithDelay();
                
                // Create paint trail
                createPaintTrail(mouseX, mouseY, velocityX, velocityY);
            });

            // Smooth cursor animation
            function animateCursor() {
                const delay = 0.1;
                cursorX += (mouseX - cursorX) * delay;
                cursorY += (mouseY - cursorY) * delay;
                
                cursor.style.left = cursorX + 'px';
                cursor.style.top = cursorY + 'px';
                
                requestAnimationFrame(animateCursor);
            }

            animateCursor();
            
            // Initial hide timer
            hideCursorWithDelay();
        } else {
            cursor.style.display = 'none';
        }

        // Enhanced hover effects for social links
        const socialLinks = document.querySelectorAll('.social-link');
        socialLinks.forEach(link => {
            if (!isTouchDevice) {
                // Desktop hover effects
                link.addEventListener('mouseenter', () => {
                    if (cursorVisible) {
                        cursor.style.transform = 'scale(1.5)';
                        cursor.style.background = 'rgba(255, 255, 255, 0.3)';
                    }
                    
                    // Create burst of paint on hover
                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            createPaintTrail(
                                mouseX + (Math.random() - 0.5) * 50,
                                mouseY + (Math.random() - 0.5) * 50,
                                (Math.random() - 0.5) * 20,
                                (Math.random() - 0.5) * 20
                            );
                        }, i * 50);
                    }
                });
                
                link.addEventListener('mouseleave', () => {
                    if (cursorVisible) {
                        cursor.style.transform = 'scale(1)';
                        cursor.style.background = 'rgba(255, 255, 255, 0.1)';
                    }
                });
            } else {
                // Touch device feedback
                link.addEventListener('touchstart', () => {
                    link.style.transform = 'scale(0.95)';
                    link.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                });
                
                link.addEventListener('touchend', () => {
                    setTimeout(() => {
                        link.style.transform = '';
                        link.style.backgroundColor = '';
                    }, 150);
                });
            }
        });

        // Responsive parallax effect
        if (!isMobile && window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const { clientX, clientY } = e;
                const { innerWidth, innerHeight } = window;
                
                const xPercent = (clientX / innerWidth - 0.5) * 2;
                const yPercent = (clientY / innerHeight - 0.5) * 2;
                
                // Reduce parallax intensity on smaller screens
                const intensity = window.innerWidth > 1024 ? 10 : 5;
                
                const container = document.querySelector('.container');
                container.style.transform = `translate(${xPercent * intensity}px, ${yPercent * intensity}px)`;
            });
        }

        // Mouse leave/enter events for cursor visibility
        document.addEventListener('mouseleave', () => {
            if (!isMobile && !isTouchDevice) {
                cursor.classList.add('hidden');
                clearTimeout(hideTimeout);
            }
        });

        document.addEventListener('mouseenter', () => {
            if (!isMobile && !isTouchDevice) {
                showCursor();
                hideCursorWithDelay();
            }
        });

        // Orientation change handler
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                initCanvas();
                // Recalculate dimensions after orientation change
                const container = document.querySelector('.container');
                container.style.transform = '';
                
                // Reset cursor position
                if (!isMobile && !isTouchDevice) {
                    cursorX = window.innerWidth / 2;
                    cursorY = window.innerHeight / 2;
                }
            }, 100);
        });

        // Resize handler for responsive adjustments
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                initCanvas();
                // Reset transforms on resize
                const container = document.querySelector('.container');
                if (window.innerWidth <= 768) {
                    container.style.transform = '';
                }
            }, 250);
        });

        // Performance optimization for low-end devices
        const preferReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (preferReducedMotion) {
            // Disable animations for users who prefer reduced motion
            const style = document.createElement('style');
            style.textContent = `
                *, *::before, *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                }
                #paintCanvas { display: none !important; }
            `;
            document.head.appendChild(style);
        }

        // Prevent zoom on double tap for iOS Safari
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (event) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Initialize everything
        initCanvas();
        animate();

        // Typing effect for the name (optional enhancement)
        const nameElement = document.querySelector('.name');
        const originalText = nameElement.textContent;
        
        function typeWriter() {
            nameElement.textContent = '';
            let i = 0;
            
            function type() {
                if (i < originalText.length) {
                    nameElement.textContent += originalText.charAt(i);
                    i++;
                    setTimeout(type, window.innerWidth > 768 ? 100 : 50);
                }
            }
            
            type();
        }

        // Uncomment the line below if you want the typing effect
        // setTimeout(typeWriter, 500);
    </script>
</body>
</html>
